# Example: pyproject.toml-style metadata expressed as python-config assignments.
# Serves as an excessive configuration file to test against.
# NOTE: This commentary until the PROJECT_NAME must be preserved!
# vim: set tf=python:

"""Module docstrings are supported too."""

PROJECT_NAME = "python-config"

VERSION = "1.0.0"
"""PEP 440 version string."""

ENABLED = True

DISABLED = False
"""Disabled has precedence over enabled due to implementation shenanigans."""

LOG_LEVEL = 3

CLOG_LEVEL = -1
"""Negative one."""

APPROX_BYTE_BITS = 8.0

APPROX_FRIDGE_TEMP_C = -17.0
"""I hope I remember correctly."""

BUILD_NUMBER = 7

TWEAKS_CHUNK_SIZE = 4096
"""Chunk size for IO operations."""

PACKAGE_NAME = "python-config-1.0.0"

PACKAGE_FULLNAME = "python-config-1.0.0.7"
"""Fully qualified package name.

Multiline docstrings must be supported too.
"""

CLASSIFIERS = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

METADATA = [
    {
        "name": "default-pr-template",
        "value": ".github/templates/pr.md",
    },
    {
        "name": "default-smoke-hook",
        "value": ".github/hooks/smoke-python-config",
    },
    {
        "name": "max-test-duration-ms",
        "value": 120000,
    },
]
"""Little nesting involved."""

PROJECT = {
    "name": "python-config",
    "dynamic": [
        "version",
    ],
    "description": "A library for reading Python configuration files",
    "readme": "README.rst",
    "license": "GPL-3.0",
    "keywords": [
        "ast",
        "config",
        "library",
    ],
    "classifiers": {
        "$REF": "CLASSIFIERS",
    },
    "requires-python": ">=3.9",
    "authors": [
        {
            "name": "Dmitry Konishchev",
            "email": "konishchev@gmail.com",
        },
        {
            "name": "Pavel Kulyov",
            "email": "kulyov.pavel@gmail.com",
        },
    ],
    "include-data": True,
    "tools": {
        "ruff": {
            "line-length": 100,
            "rules": [
                "E",
                "A",
                "B",
            ],
        },
        "sphinx-upload": {
            "path": "docs/python-config/1.0.0",
        },
    },
}
"""
Complex assignment.
Multiline string with hanging bracket.
"""
